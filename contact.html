<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact - Renter-car</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ton CSS -->
  <link rel="stylesheet" href="css/accueil.css">
</head>
<body>

  <!-- ✅ NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="index.html">🚗 Renter-car</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Ouvrir le menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html#voitures">Louer une voiture</a></li>
        <li class="nav-item"><a class="nav-link" href="utilitaires.html">Utilitaires</a></li>
        <li class="nav-item"><a class="nav-link" href="agences.html">Agences</a></li>
        <li class="nav-item"><a class="nav-link" href="chauffeur.html">Chauffeur</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

  <!-- ✅ HERO SECTION -->
  <section class="hero-section d-flex align-items-center justify-content-center text-white text-center">
    <div class="overlay"></div>
    <div class="position-relative z-1">
      <h1 class="display-4 fw-bold">Contactez-nous</h1>
      <p class="lead">Une question ? Un devis ? Nous sommes à votre écoute.</p>
    </div>
  </section>

  <!-- ✅ FORMULAIRE DE CONTACT -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Nom</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Adresse email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-success">Envoyer</button>
        </form>
      </div>
    </div>
  </main>

  <!-- ✅ FOOTER -->
  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">&copy; 2025 Renter-car. Tous droits réservés.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
